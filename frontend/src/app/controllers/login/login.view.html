<div class="page-wrapper">
  <div class="form-card">
    <div class="form-header">
      <h2>IT 02-1</h2>
      <p>ลงชื่อเข้าใช้งานระบบ</p>
    </div>

    <div class="form-body">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้งาน</label>
        <input id="username" type="text" [(ngModel)]="form.username" placeholder="กรอกชื่อผู้ใช้งาน" />
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input id="password" type="password" [(ngModel)]="form.password" placeholder="กรอกรหัสผ่าน" />
      </div>

      @if (errorMessage) {
        <p class="error-text">{{ errorMessage }}</p>
      }

      <button class="btn-primary" (click)="onLogin()">ลงชื่อเข้าใช้งาน</button>
      <button class="btn-secondary" (click)="goToRegister()">สมัครสมาชิก</button>
    </div>
  </div>
</div>
