<div class="page-wrapper">
  <div class="form-card">
    <div class="form-header">
      <h2>IT 02-2</h2>
      <p>สมัครสมาชิก</p>
    </div>

    <div class="form-body">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้งาน</label>
        <input id="username" type="text" [(ngModel)]="username" placeholder="กรอกชื่อผู้ใช้งาน" />
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input id="password" type="password" [(ngModel)]="password" placeholder="กรอกรหัสผ่าน" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="กรอกรหัสผ่านอีกครั้ง"
          [class.input-error]="passwordMismatch"
        />
        @if (passwordMismatch) {
          <span class="field-error">รหัสผ่านไม่ตรงกัน</span>
        }
      </div>

      @if (errorMessage) {
        <p class="error-text">{{ errorMessage }}</p>
      }

      @if (successMessage) {
        <p class="success-text">{{ successMessage }}</p>
      }

      <button class="btn-primary" (click)="onRegister()">สมัครสมาชิก</button>
      <button class="btn-secondary" (click)="goBack()">ย้อนกลับ</button>
    </div>
  </div>
</div>
